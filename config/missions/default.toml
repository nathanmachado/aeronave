# Missão baseline — requisitos do projeto originados das premissas do
# cliente. Antes da Task 2.2, estes valores eram constantes hardcoded em
# `Requirements::project_default()` (src/models/requirements.rs). Trocar de
# missão agora é trocar este arquivo, não o código.

passengers = 4
pax_mass_kg = 90.0
baggage_kg = 80.0
cruise_speed_min_kmh = 280.0
endurance_min_h = 8.0
fuel_reserve_fraction = 0.10   # 10% + 45 min embutidos no endurance
cruise_altitude_m = 2500.0
airfield_altitude_m = 0.0
isa_delta_c = 0.0

# Análise de missão por segmentos (Task 5.1) — táxi, subida integrada,
# cruzeiro Breguet e descida substituem o antigo modelo de consumo
# constante. Ver `agents::mission::MissionAgent` e
# `models::requirements::AnalysisCfg`.
[analysis]
taxi_fuel_l = 3.0              # táxi + run-up fixo (L)
descent_rate_ms = 4.0          # taxa de descida de projeto (m/s)
descent_power_fraction = 0.20  # 20% da vazão de combustível de cruzeiro
climb_speed_policy = "vy"      # única política suportada hoje
