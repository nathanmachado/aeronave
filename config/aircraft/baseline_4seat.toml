# Aeronave baseline — 4 lugares, asa baixa, trem retrátil elétrico.
# Todos os valores abaixo eram, antes da Task 2.1, constantes hardcoded em
# src/ (AircraftState::initial(), ArmConfig::default_layout(), oew_items(),
# constantes NACA 23015 em aerodynamics.rs, Al7075T6 em structural.rs,
# posições/massas em landing_gear.rs e main.rs). Trocar de célula-base
# agora é trocar este arquivo, não o código.

[sizing]
mtow_initial_guess_kg = 1461.0   # estimativa inicial (laço de projeto) — não é requisito
mtow_max_kg = 1800.0             # limite superior aceito pelo laço de convergência (Task 3.1)

[wing]
span_m = 11.94
area_m2 = 14.2
taper_ratio = 0.45
airfoil = "NACA 23015"
thickness_ratio = 0.15
cl_max_clean = 1.45
# Campanha E10 (2026-08-08): 1.72 → 2.1 — troca do flap SIMPLES (plain) por
# flap SLOTTED (fenda simples) na mesma envergadura/corda já dimensionada por
# [control_surfaces] (flap_chord_frac=0.30, 40% da semi-envergadura). 2.1 é
# valor típico de literatura para asa com slotted flap de fenda simples
# (Raymer cap. 5 Tab. 5.3 / Gudmundsson cap. 9, faixa 1.8–2.2 para este tipo).
# CONSEQUÊNCIA que motivou a mudança: VS0 cai, V_ref de pouso cai, e a
# distância de POUSO EM GRAMA sobre 15 m sai de 605 m (violação, pista de
# 600 m) para ≈557 m. cl_max_flaps antigo: 1.72.
cl_max_flaps = 2.1
cd0_wing = 0.0050
le_root_x_m = 2.90          # única fonte da posição do bordo de ataque
# Cm_ac do perfil NACA 23015 em torno do seu próprio CA — quase nulo
# (característica da série 230, Abbott & von Doenhoff). ΔCm de flap de
# pouso: semi-empírico (Raymer cap. 16, faixa típica −0.20 a −0.45).
# Consumidos por agents::trim_authority (task trim-authority) — limite
# dianteiro FÍSICO do envelope de CG, substitui o antigo proxy
# [stability].sm_max (removido, ver abaixo).
#
# Campanha E10 (2026-08-08): cm_flap_delta permanece −0.30 (INALTERADO)
# mesmo com a troca para flap SLOTTED (cl_max_flaps 1.72 → 2.1 acima). −0.30
# é o meio da faixa de Raymer e corresponde a um slotted MODERADO — de fenda
# simples, corda de 30% e ~40% da semi-envergadura, não a um Fowler de grande
# translação (que puxaria ΔCm para a ponta pessimista da faixa, ≈−0.45).
# Registrado explicitamente porque a hipótese fica mais forte com o slotted:
# se o flap real desta célula render mais ΔCL do que o modelado aqui, o ΔCm
# associado também sobe e o limite de flare recua — validar em ensaio/CFD
# antes de congelar (mesma classe de parâmetro semi-empírico que cm_ac).
cm_ac = -0.008
cm_flap_delta = -0.30
# ΔCD0 do flap CHEIO (pouso) — ciclo 8, task 1: fecha PARCIALMENTE a lacuna
# declarada desde o ciclo 7 ("não existe modelo de flap na polar deste
# crate") — só o segmento de SUBIDA da decolagem consome este delta; a
# rolagem de solo (segmento dominante, método energético) e a aproximação
# de pouso (ângulo fixo) seguem sem termo de arrasto de flap. 0.015
# é o valor central de um flap SLOTTED moderado (Raymer cap. 12 / Hoerner
# "Fluid-Dynamic Drag" — faixa típica de incremento parasita por deployment
# de flap com fenda simples, corda ~30%, sem grande translação tipo Fowler).
# Consumido por agents::performance::excess_power_kw via a fração PARCIAL de
# decolagem (WingSpec::cd0_flap_to_extra = to_flap_fraction·cd0_flap_delta),
# mesma fração que já governa cl_max_to/cm_flap_delta na rotação — não há
# call site de pouso que consuma o delta CHEIO (auditoria de
# agents::performance, ver docstring de WingCfg::cd0_flap_delta).
cd0_flap_delta = 0.015

[fuselage]
length_m = 8.2
cabin_width_m = 1.22
cabin_height_m = 1.20
cd0 = 0.010

[empennage]
# Braço da empenagem (CA asa → CA empenagem) — usado tanto no
# dimensionamento por coeficiente de volume abaixo quanto no ponto neutro.
tail_arm_m = 4.80
# Dimensionamento por coeficiente de volume (Task 4.1, Raymer Tab. 6.4,
# monomotor GA): S_h = v_h·S_w·MAC/l_h, S_v = v_v·S_w·b/l_v.
#
# Campanha E1–E6 (2026-08-05), mudança 5: v_h 0.70 → 0.85 (EH maior,
# S_h 2.58 → 3.13 m²) — validado experimentalmente (variantes de
# scratchpad, envelope [10.9%, 43.5%] MAC, 6/6 cenários dentro). Um EH
# maior avança o limite de rotação (mais autoridade de profundor) E recua
# o ponto neutro (mais estabilizador), alargando o envelope de CG
# admissível dos dois lados — é a mudança que mais contribui para fechar
# o envelope vazio do baseline anterior (junto com a mudança 1,
# gear.x_main_m). v_h antigo: 0.70.
v_h = 0.85
v_v = 0.04
ar_h = 4.0
ar_v = 1.5
taper_h = 0.5
taper_v = 0.5
eta_h = 0.90
# Ciclo 3 (oew-parametrico): mass_per_area_h_kg_m2/mass_per_area_v_kg_m2
# foram REMOVIDOS — a massa das empenagens agora é COMPUTADA pelas equações
# de componente de Raymer (cap. 15.2, agents::mass_model) a partir da área
# REALMENTE dimensionada (agents::empennage), de N_z, q, alongamento e
# afilamento, escalada por [mass_model].composite_factor_tail. Erro de
# migração claro se estas chaves ainda estiverem presentes aqui
# (models::config::check_mass_per_area_migration).
#
# Task refino-ciclo2 (1b): fator de área de CD0 da empenagem — substitui o
# antigo campo [empennage].cd0 (fixo, 0.0046).
#   cd0_area_factor = 0.0046·S_w/(S_h+S_v) ≈ 0.014366 ≈ 2·Cf·FF
#     (coeficiente de atrito de placa plana turbulenta × fator de forma,
#     referenciado à área da ASA — não à área molhada da própria
#     empenagem, daí o valor bem acima de um 2·Cf·FF típico de ~0.006–0.010
#     referenciado à própria área). Faixa 0.008–0.025.
cd0_area_factor = 0.014366
# Task refino-ciclo2 (Task 4): eficiência de Oswald da empenagem horizontal —
# usada no arrasto de trim de cruzeiro (agents::trim_authority::cd_trim_cruise).
# 0.70 é um valor conservador/típico de literatura para superfícies de cauda
# de baixo alongamento (Raymer/Gudmundsson) — sem medição direta neste
# projeto (mesma classe de parâmetro semi-empírico que cl_h_max_down era
# antes da Task 1a). Faixa 0.5–0.95.
e_h = 0.70
# Espessura relativa dos perfis da empenagem (ciclo 4) — NACA 0009–0012
# típicos; alimenta as equações de massa Raymer (EH^-0.12, EV^-0.49).
thickness_ratio = 0.10

[propeller]
# Campanha E10 (2026-08-08): 1.95 → 1.76 — consequência OBRIGATÓRIA do trem
# encurtado ([gear].h_cg_ground_m 1.05 → 0.92, −13 cm). O eixo da hélice
# desce 1:1 com o CG (ver prop_axis_above_cg_m abaixo), então a folga de
# ponta de pá ao solo cairia de 0.275 m para ≈0.145 m com Ø1.95 — abaixo do
# piso de projeto de 0.23 m. Com Ø1.76 a folga volta a 0.240 m ≥ 0.23. Custo
# honesto: menos área de disco → menos tração estática e um pouco menos de
# η_p, o que encurta as distâncias de decolagem menos do que antes e reduz
# levemente a velocidade de cruzeiro. diameter_m antigo: 1.95.
diameter_m = 1.76
blades = 2
psru_ratio = 1.867
psru_efficiency = 0.97
# Offset vertical FIXO da célula entre o eixo da hélice e o CG (m) — ciclo 5.
# A altura do eixo ao solo agora DERIVA do trem: shaft_height =
# gear.h_cg_ground_m + prop_axis_above_cg_m = 0.92 + 0.20 = 1.12 (campanha
# E10; era 1.05 + 0.20 = 1.25 até E7 — encurtar o trem consome folga de
# hélice 1:1, foi exatamente o que aconteceu aqui e obrigou a reduzir
# diameter_m acima). Validar no CAD (Fase 3).
prop_axis_above_cg_m = 0.20
# Limites de Mach de ponta de pá (Task 4.5) — verificação de compressibilidade.
tip_mach_max_static = 0.85
tip_mach_max_cruise = 0.80
# Folga mínima ponta de pá → solo (m). CS 23.925 exige >= 0.18 m (7 pol);
# usamos 0.23 m (9 pol) de margem de projeto.
#
# CAVEAT (revisão final, campanha E10): o modelo computa folga ESTÁTICA,
# trem TOTALMENTE ESTENDIDO, aeronave nivelada (ver
# `agents::landing_gear`/`shaft_height` em `main.rs`) — NÃO desconta a
# compressão do amortecedor oleo-pneumático nem o pneu murcho/parcialmente
# descarregado, que é a condição efetivamente crítica do CS 23.925 (folga
# mínima sob compressão de projeto, não em repouso). O piso de 0.23 m aqui é
# um PROXY de projeto conservador na fase conceitual, não uma verificação
# direta do requisito regulatório — validar com o curso real do amortecedor
# (`[mass_model].main_strut_length_m`) e a compressão de projeto antes de
# certificação.
ground_clearance_min_m = 0.23

[fuel_system]
# 260 L: dimensionado pela convergência de MTOW (Task 3.1) — no MTOW
# convergido de então (~1.529,9 kg, modelo de consumo constante) a missão
# de 8h exigia 243,92 L; margem de 16,08 L (~6,6%). (O tanque original de
# 240 L ficava 3,92 L / 1,6% curto no ponto convergido — não os
# "0,73 L / 0,3%" reportados inicialmente, que vinham de um transiente da
# checagem por-iteração, corrigido na revisão da Task 3.1.)
#
# ATUALIZAÇÃO (Task 5.1): `MissionAgent` (análise de missão por segmentos —
# táxi, subida integrada, cruzeiro Breguet, descida, reserva) substitui o
# modelo de consumo constante. No MTOW convergido honesto a mesma missão de
# 8h exige menos combustível que o modelo antigo — margem sobre os 260 L
# sobe de ~6,6% para ~10,0% (ver tabela completa em
# `tests/generic_engine.rs::golden_toyota_baseline_regressao_task_2_1` e
# `margem_de_combustivel_no_mtow_convergido`). Achado retroativo: o tanque
# ORIGINAL de 240 L, que motivou o aumento acima, teria sido SUFICIENTE
# sob a hipótese de CRUZEIRO BREGUET A L/D CONSTANTE (ver
# `agents::mission`) usada neste modelo — margem apertada, ~1,5%
# (`tests/generic_engine.rs::orchestrator_toyota_240l_suficiente_de_novo_com_missao_de_7h`,
# renomeado várias vezes conforme este número oscila entre campanhas — ver
# nome/comentário atuais nesse teste para o estado mais recente).
# Achado da revisão desta task (Finding 4): essa suficiência NÃO deve ser
# lida como "não é uma restrição física permanente" em geral — é
# específica da hipótese de L/D constante ao longo do cruzeiro; um modelo
# de cruzeiro NIVELADO (altitude constante, mais realista para uma missão
# real com ATC/espaço aéreo) estimado pelo revisor fica ~1% de distância de
# reverter esta conclusão de volta para "insuficiente". Mantido em 260 L
# (não revertido): decisão de projeto já tomada que continua dando MAIS
# margem sob o modelo novo, não menos, e não depende dessa hipótese
# apertada de 240 L.
#
# ATUALIZAÇÃO (campanha E7, 2026-08-06): `mission.endurance_min_h` 8,0→7,0h
# (decisão de requisito do cliente, ver `config/missions/default.toml`)
# reduz o combustível exigido pela missão (255,9→≈223,7 L) — margem sobre
# os 260 L sobe de ~1,58% para ≈13,97%. Mantido em 260 L (decisão de
# projeto já tomada, continua dando mais margem, não menos).
#
# ATUALIZAÇÃO (campanha E10, 2026-08-08): `capacity_l` NÃO muda, mas a
# margem sim, e para baixo — a hélice Ø1,95→1,76 m (η_p 81,0%→78,4%) e os
# +25 kg de bateria (MTOW de missão 1.512,4→1.537,6 kg) elevam o
# combustível exigido de 222,7 para 236,2 L: margem 14,33%→**9,14%** da
# capacidade (piso `min_fuel_margin_fraction` = 5%). É a folga que E10 mais
# consome. O aviso da Finding 4 acima volta a valer com força: sob a
# hipótese de CRUZEIRO BREGUET A L/D CONSTANTE a missão cabe; um modelo de
# cruzeiro NIVELADO comeria boa parte desses 4,1 pp de folga restantes.
# Mantido em 260 L (nenhuma decisão nova aqui), mas registrado: se uma
# campanha futura precisar de folga de combustível, este é o primeiro
# lugar a olhar.
capacity_l = 260.0

[gear]
retractable = true
cd0_fixed_increment = 0.008
# Campanha E10 (2026-08-08): 1.05 → 0.92 — trem CURTO. A altura do CG ao
# solo é a alavanca do tipback (Raymer cap. 11: quanto mais baixo o CG, maior
# o ângulo de tipback para o mesmo x_main). E10 adiciona 25 kg de bateria no
# cone de cauda (ver "bateria_recolocada"), o que recua o CG e por si só já
# ajuda o tipback; baixar o CG 13 cm dá a folga necessária para que o tipback
# sobreviva TAMBÉM nos dois mundos adversariais de ±15% de massa estrutural
# (validation::robustness), não só no nominal. Encurtar o trem custa folga de
# hélice 1:1 — pago com [propeller].diameter_m 1.95 → 1.76. Coerência
# dimensional das pernas em [mass_model].*_strut_length_m. Antigo: 1.05.
h_cg_ground_m = 0.92
# Campanha E10 (2026-08-08): 1.40 → 1.30 — trem de nariz avançado 10 cm.
# A carga de nariz é ~(x_cg − x_main)/(x_main − x_nose): afastar o nariz do
# trem principal alonga o denominador e DILUI a carga percentual no CG mais
# dianteiro. Era 28.6% (violação do teto de 25%) no baseline E7; com esta
# mudança + o recuo de CG da bateria de E10 cai para ≈22.8%, com folga
# suficiente para sobreviver aos mundos adversariais de massa. Antigo: 1.40.
x_nose_m = 1.30
# Campanha E1–E6 (2026-08-05), mudança 1: 3.85 → 3.55 — CAUSA RAIZ do
# envelope de CG vazio do baseline anterior (trem principal longe demais
# atrás do CG útil desta célula, empurrando o limite de rotação para
# 39.9% MAC, atrás do limite traseiro de 36.6% MAC). Com x_main=3.55m o
# limite de rotação recua para ~22.2% MAC (form fechada, TrimAuthorityAgent)
# e a carga de nariz cai de ~23.8% para ~9% (ainda dentro de 8–25%, ver
# [performance]/LandingGearAgent). Validado experimentalmente (campanha
# E1–E6, variantes de scratchpad). x_main_m antigo: 3.85.
#
# Campanha E7 (2026-08-06): 3.55 → 3.66 — fecha o tipback (10,1°→15,58°
# ≥ piso de 15°, ver bloco tipback_min_deg abaixo) mantendo a carga de
# nariz ≤25% (≈24,8%) e o envelope de CG fechado 6/6 cenários. Só é
# viável porque a autoridade DATCOM de profundor (ciclo 2,
# TrimAuthorityAgent) alargou o limite de rotação para ~13,0% MAC nesta
# posição (valor da época, ciclos 2-6) — sem essa folga o trem não poderia
# recuar mais. ATUALIZAÇÃO (ciclo 7, cl_max_to): o limite dianteiro de
# rotação recuou ainda mais, para 8,908% MAC (ver docs/aircraft_spec.
# schema.md §1 v5.0) — MAIS folga que a época de E7 assumia, não menos;
# a conclusão de viabilidade acima fica FORTALECIDA, não invalidada. Janela viável
# da campanha: 3,65–3,66 m; 3,66 escolhido pela melhor pior-margem entre
# os 6 cenários de carga. Validado experimentalmente (campanha E7, 48
# execuções do pipeline real). x_main_m antigo (E1–E6): 3.55.
x_main_m = 3.66
# Ciclo 3 (oew-parametrico): mass_main_leg_kg REMOVIDO — a massa do trem de
# pouso agora é COMPUTADA (Raymer cap. 15.2, agents::mass_model) a partir de
# [mass_model].landing_load_factor_ult/main_strut_length_m/nose_strut_length_m
# × composite_factor_gear, e o atuador de retração usa a massa computada de
# UMA perna (trem_principal_kg/2, agents::landing_gear). Erro de migração
# claro se a chave ainda estiver presente aqui
# (models::config::check_mass_main_leg_migration).
#
# Revisão final (oew-parametrico): mass_nose_kg (22,0 kg) também REMOVIDO —
# mesmo tratamento acima. O campo era config morta (nenhum código de
# produção o lia) e já divergia da massa de nariz COMPUTADA
# (agents::mass_model::nose_gear_mass_raymer_kg ≈ 19,81 kg neste baseline).
# Erro de migração claro se a chave ainda estiver presente aqui
# (models::config::check_mass_nose_migration).
retraction_time_s = 7.0
actuators_doors_mass_kg = 20.0
# Tipback/tail-strike (Task 2, refino-ciclo2) — Raymer, "Aircraft Design",
# cap. 11. tipback_min_deg=15° é o piso típico de projeto; rotation_
# attitude_deg=11° é a atitude de picada nominal de rotação/flare desta
# célula (ver [performance] rotation_time_s/flare_time_s, tempos — não
# ângulos — do mesmo evento). tail_cone_x_m/tail_cone_height_m descrevem a
# geometria SIMPLIFICADA do cone de cauda (ver agents::landing_gear::
# tail_strike_margin_deg para a aproximação exata).
#
# ACHADO HONESTO (Task 2, baseline E6): com o trem recuado pela Task
# 1/campanha E1–E6 (x_main 3.85→3.55m, para abrir o envelope de CG via
# autoridade de rotação), o ângulo de tipback real caiu para ≈10,1° —
# ABAIXO do piso de 15°. Isto foi reportado como violação (ver
# ConstraintChecker::verify, checks #15-#17, e a varredura informativa de
# x_main impressa por `main.rs`) — não mascarado por config. Tail-strike e
# carga de nariz (dois extremos) continuaram OK. Decisão de projeto (recuar
# o trem mais, ou aceitar o tipback e mitigar operacionalmente — ex. cauda
# reforçada/skid) ficou para revisão humana.
#
# RESOLVIDO na campanha E7 (2026-08-06): x_main_m 3.55→3.66 (ver acima),
# viável porque a autoridade de rotação DATCOM (ciclo 2) alargou o limite
# dianteiro. Tipback sobe para ≈15,58° (≥ 15° piso), tail-strike ≈14,88°
# (folga mantida), carga de nariz ≈13,0–24,8% (dentro de 8–25%). Gate
# permanece ativo — continua detectando a violação em configs sintéticas
# mutadas (ver tests/gear_tipback.rs, tests/cli.rs — cobertura do check
# #15 preservada).
#
# ATUALIZAÇÃO (campanha E10, 2026-08-08): `tipback_min_deg` e
# `rotation_attitude_deg` INALTERADOS; o ângulo REAL muda. A bateria de
# 53 kg a 7,80 m recua o CG mais traseiro (32,2%→38,8% MAC), encurtando
# `(x_main − x_cg_aft)` e derrubando o tipback; `h_cg_ground_m` 1,05→0,92
# recupera parte disso (CG mais baixo ⟹ mais tipback). Saldo: 18,85°→
# **16,74°**, ainda acima do piso de 15° — e agora robusto: com massas
# estruturais a ±15% (RobustnessAgent, check #19) o tipback continua
# passando nos três mundos.
#
# CORREÇÃO (revisão final, campanha E10): tail-strike NÃO ficou
# "inalterado, só geometria" como o comentário anterior afirmava —
# `tail_cone_height_m` (abaixo) tinha ficado esquecido em 1.10 m enquanto
# `h_cg_ground_m` 1,05→0,92 baixava a célula inteira 13 cm. Corrigido para
# 0.97 (ver comentário do campo); tail-strike recalculado de 14,88° para
# ≈13,19° — ainda bem acima do piso de 11° (rotation_attitude_deg).
tipback_min_deg = 15.0
rotation_attitude_deg = 11.0
tail_cone_x_m = 7.80
# Campanha E10 (2026-08-08, corrigido na revisão final): 1.10 → 0.97 —
# `tail_cone_height_m` é a altura do FUNDO do cone de cauda acima do SOLO
# em atitude ESTÁTICA (trem estendido, ver
# `agents::landing_gear::tail_strike_margin_deg`), não uma dimensão da
# célula independente do trem. A campanha E10 baixou toda a célula 13 cm
# (`h_cg_ground_m` 1,05→0,92) para ganhar tipback — o cone de cauda desce
# junto, rigidamente, com o resto da aeronave. O valor ficou parado em
# 1.10 na primeira rodada de E10 (erro corrigido nesta revisão, não uma
# mudança de projeto nova): 1.10 − 0.13 = 0.97. Consequência: tail-strike
# 14,88° → ≈13,19° (folga MENOR, ainda acima do piso de 11°,
# `rotation_attitude_deg`). Antigo (pré-E10): 1.10.
tail_cone_height_m = 0.97
# Ciclo 8 (task 2, 2026-08-08): deflexão TOTAL do pneu de nariz na condição
# CRÍTICA de CS 23.925 (batente do amortecedor de nariz TOTALMENTE
# COMPRIMIDO + pneu MURCHO/estourado) — pneu 5.00-5 típico desta classe.
# Hélice TRATORA: é o trem de NARIZ que governa a folga crítica de hélice
# (fica sob o eixo do motor/hélice, dianteiro), não o principal. Consumido
# por `specs::PropellerSpec::with_critical_clearance` junto com
# `GearSpec::nose_oleo_stroke_mm` — ver checagem #25,
# `validation::constraint_checker::ConstraintChecker::verify`.
tire_deflation_delta_m = 0.08

[arms]      # braços de momento (m do datum no nariz)
engine_cg_m = 0.65
avionics_m = 1.10
pax_front_m = 3.20
fuel_cg_m = 3.55
wing_struct_m = 3.70
pax_rear_m = 4.55
fuselage_struct_m = 4.20
# Campanha E1–E6 (2026-08-05), mudança 4: 5.60 → 4.90 — bagageiro
# avançado, comprime a dispersão de CG dos cenários COM bagagem em
# relação aos cenários SEM bagagem (ajuda a manter todos os 6 cenários
# dentro do envelope fechado pelas mudanças 1 e 5). baggage_m antigo: 5.60.
baggage_m = 4.90
empennage_cg_m = 7.40

[structure]
spar_material = "AA7075-T6"
frame_spacing_mm = 300.0
design_category = "normal"    # normal | utility | acrobatic → n_lim 3.8/4.4/6.0

[drag]
cd0_misc = 0.003
# Fração do arrasto parasita TOTAL (asa+fuselagem+empenagem+trem+misc)
# atribuída à refrigeração do motor a pistão (entrada de ar do
# radiador/intercooler, dutos, saída de ar quente) — Task 5.2. Típico
# 3-5% para uma instalação bem carenada (Raymer cap. 12 / Hoerner
# "Fluid-Dynamic Drag"). Aplicado como multiplicador (1 + fração) sobre a
# soma das demais parcelas em `agents::aerodynamics::cd0_total` — CD0 total
# sobe de 0.022 para 0.02288 (+4%). CONSEQUÊNCIA HONESTA: mais arrasto
# parasita reduz L/D, o que reduz V_max de cruzeiro em alguns km/h e eleva
# o consumo/combustível de missão — o MTOW convergido sobe (ver
# `tests/generic_engine.rs`, tabela old→new no comentário de
# `golden_toyota_baseline_regressao_task_2_1`, atualizada na Task 5.2).
cooling_drag_fraction = 0.04

# Envelope de CG admissível (Task 4.4 + task trim-authority) — limite
# TRASEIRO (sm_min, margem estática mínima) + parâmetros da autoridade de
# profundor que definem o limite DIANTEIRO FÍSICO (agents::trim_authority,
# TrimAuthorityAgent — substitui o antigo proxy sm_max, REMOVIDO: uma
# config com sm_max presente agora falha com um erro de migração claro em
# models::config::parse_aircraft).
[stability]
sm_min = 0.05   # margem estática mínima — limite TRASEIRO do CG
# Task refino-ciclo2 (1a): `cl_h_max_down` deixou de ser um parâmetro livre
# de config — agora é CALCULADO por geometria DATCOM/Nelson
# (agents::trim_authority::cl_h_max_down_calc, a partir de
# [control_surfaces].elevator_chord_frac/elevator_deflection_max_deg e
# EmpennageSpec.ar_h). `cl_h_stall_limit` fica só como TETO físico (download
# de profundor acima do CL_max da própria empenagem não é alcançável — a
# superfície estola antes). Faixa típica 0.8-1.4 (Gudmundsson/Roskam).
# Baseline: cl_h_max_down_calc ≈ 1.0578 (c_e/c=0.40, AR_h=4.0, δe_max=25°)
# — abaixo do teto, NÃO limitado por stall (capped_by_stall=false). Ainda
# assim SENSÍVEL a elevator_deflection_max_deg (±2°) — ver TrimSpec.
# sensitivity no JSON de saída; validar em ensaio antes de congelar como
# valor de certificação. cl_h_max_down (parâmetro livre antigo): 0.95.
cl_h_stall_limit = 1.10
trim_margin = 0.10        # fração da autoridade reservada como margem (efeito solo + certificação)
cl_ground_rotation = 0.5  # CL da asa na corrida de decolagem antes da rotação (faixa 0-1)
# Fração de DEPLOYMENT do flap no setting de DECOLAGEM (ciclo 7 — renomeada de
# `to_flap_cm_fraction`, PAPEL DUPLO): governa os dois efeitos do flap parcial
#   ΔCm: Cm_TO = cm_ac + to_flap_fraction·cm_flap_delta        (rotação)
#   ΔCL: cl_max_to = cl_max_clean + to_flap_fraction·(cl_max_flaps − cl_max_clean)
#        → Vr da rotação E distâncias de decolagem (antes usavam o CLmax de POUSO)
#
# Campanha E10 (2026-08-08): 0.5 → 0.35 — setting de decolagem com MENOS
# flap. Com o flap SLOTTED de E10 (cl_max_flaps 1.72 → 2.1) manter 0.5 daria
# um ΔCm de nariz-para-baixo maior no momento da rotação, apertando o limite
# dianteiro de rotação justo quando o CG recuou. 0.35 mantém cl_max_to
# praticamente no valor de E7 (1.45 + 0.35·0.65 = 1.6775 vs 1.585 antes —
# ainda MELHOR para as distâncias de decolagem) enquanto reduz o ΔCm de
# rotação (0.35·(−0.30) = −0.105 vs −0.15). É o que faz a margem de rotação
# do cenário mais dianteiro sobreviver aos mundos adversariais. Antigo: 0.5.
to_flap_fraction = 0.35
# Coeficiente de Multhopp simplificado (Raymer eq. 16.25, fig. 16.14) para a
# contribuição desestabilizadora da fuselagem no ponto neutro — faixa típica
# 0.01-0.03 conforme a posição vertical da asa na fuselagem (asa baixa como
# esta aeronave tende à parte superior da faixa). Ver
# `weight_balance::fuselage_np_shift_mac`.
fuselage_kf = 0.02

# Parâmetros de desempenho (Task 4.7) — substituem os fatores ad hoc do M5
# (tração estática sem correção, distância de pouso aérea fixa em 200m,
# fatores de superfície /√surface_factor) por dados de configuração.
[performance]
mu_brake_paved = 0.40      # frenagem em pista pavimentada seca
mu_brake_grass = 0.30      # frenagem em grama firme/terra compactada
# Fator empírico (McCormick) sobre a tração estática ideal de Rankine-Froude
# (disco atuador) — corrige a superestimativa por não modelar perdas de
# ponta de pá/rotação de esteira.
static_thrust_factor = 0.75
rotation_time_s = 1.0      # tempo de rotação até V_LOF, s
flare_time_s = 1.5         # tempo de flare no pouso a V_ref, s
approach_angle_deg = 3.0   # ângulo de aproximação padrão até 15m (50 ft)

# Superfícies de controle (Task 4.2) — frações históricas (Raymer Tab. 6.5,
# monomotor GA) que dimensionam aileron, flap, profundor e leme a partir da
# asa (aileron/flap) e da empenagem (profundor/leme) já dimensionadas.
[control_surfaces]
aileron_span_start_frac = 0.55   # fração da semi-envergadura da asa
aileron_span_end_frac   = 0.90
aileron_chord_frac      = 0.25   # fração da corda local da asa
flap_span_start_frac    = 0.10   # após a fuselagem
flap_span_end_frac      = 0.50   # deve ser ≤ aileron_span_start_frac (sem sobreposição)
flap_chord_frac         = 0.30
elevator_span_frac      = 0.90   # fração da envergadura do EH
# Campanha E1–E6 (2026-08-05), mudança 6: 0.35 → 0.40 — profundor maior,
# coerência geométrica com a mudança 7 (mais autoridade de profundor
# pressupõe corda maior). Antigo: 0.35. Task refino-ciclo2 (1a): esta
# fração É a razão c_e/c usada por agents::trim_authority::tau_elevator
# (ajuste de Nelson, válido em c_e/c ∈ [0.1, 0.6] — 0.40 está dentro).
elevator_chord_frac     = 0.40
# Deflexão máxima do profundor no batente (task refino-ciclo2, 1a) — faixa
# típica 10-35° (Gudmundsson/Roskam). Junto com elevator_chord_frac acima
# e EmpennageSpec.ar_h (4.0), determina cl_h_max_down_calc ≈ 1.0578 (ver
# [stability].cl_h_stall_limit).
elevator_deflection_max_deg = 25.0
rudder_span_frac        = 0.90   # fração da envergadura do EV
rudder_chord_frac       = 0.35

# Itens de massa do OEW (motor vem do EngineSpec, não daqui).
# arm_ref referencia uma entrada de [arms] (ou "wing_le_root" de [wing],
# "gear_main"/"gear_nose" de [gear]) — arm_offset_m é opcional (default 0).
[[masses.items]]
name = "psru_helice_capo"
mass_kg = 65.0
arm_ref = "engine_cg"
arm_offset_m = 0.3

[[masses.items]]
name = "resfriamento"
mass_kg = 18.0
arm_ref = "engine_cg"
arm_offset_m = 0.5

[[masses.items]]
# Campanha E1–E6 (2026-08-05), mudança 2: 60.0 → 32.0 — parte do pacote de
# aviônicos é fisicamente uma bateria, recolocada no cone de cauda (ver
# item "bateria_recolocada" abaixo); os 32.0 kg remanescentes são a
# aviônica propriamente dita, que continua no painel dianteiro. Massa
# antiga (bloco único): 60.0.
name = "avionicos"
mass_kg = 32.0
arm_ref = "avionics"

[[masses.items]]
# Campanha E1–E6 (2026-08-05), mudança 2: bateria recolocada do painel
# dianteiro (parte dos antigos 60.0 kg de "avionicos") para o cone de
# cauda — desloca massa para trás, contribuindo para recuar o CG vazio e
# ajudar a fechar o envelope (junto com as mudanças 1 e 5).
#
# Campanha E10 (2026-08-08): 28.0 → 53.0 kg e ganha arm_offset_m = 0.4
# (braço efetivo 7.40 → 7.80 m). Deixa de ser "a bateria da aviônica
# recolocada" e passa a ser o BANCO DE BATERIAS DE TRAÇÃO/RESERVA da
# diretriz de propulsão HÍBRIDA do projeto: ~53 kg de Li-ion a ~150 Wh/kg
# no nível de pacote ≈ 8 kWh instalados, dos quais ~3 kWh úteis com a janela
# de SOC conservadora (20–60%) típica de uso aeronáutico de potência.
# PAPEL DUPLO, ambos desejados: (a) energia para assistência de potência /
# cobertura do transiente de pico elétrico (ver aviso do [ ELÉTRICO ]:
# pico 1260 W > alternador 900 W); (b) COMPENSAÇÃO DE PESO no cone de cauda
# — os 25 kg extras a 7.80 m recuam o CG vazio, que é o que finalmente tira
# a carga de nariz do teto de 25% e torna tipback e rotação robustos aos
# mundos de ±15% de massa estrutural. Antigo: 28.0 kg, sem offset (7.40 m).
name = "bateria_recolocada"
mass_kg = 53.0
arm_ref = "empennage_cg"
arm_offset_m = 0.4

[[masses.items]]
name = "painel_comandos"
mass_kg = 25.0
arm_ref = "pax_front"
arm_offset_m = -0.3

# As 7 massas ESTRUTURAIS do OEW — "asa" (130.0 kg no baseline E6),
# "fuselagem" (160.0), "emp_horizontal" (27.0), "emp_vertical" (16.0),
# "trem_principal" (55.0), "trem_nariz" (22.0) e "tanques" (12.0) — NÃO são
# mais itens de [[masses.items]]: desde o ciclo 3 (oew-parametrico) são
# COMPUTADAS pelas equações de componente de Raymer (cap. 15.2,
# agents::mass_model) × os fatores de composto de [mass_model] (abaixo), e
# injetadas no orçamento de peso por agents::weight_balance::oew_items com
# os MESMOS braços (arm_ref) que os itens removidos usavam. Erro de
# migração claro se qualquer um destes 7 nomes reaparecer aqui
# (models::config::check_structural_mass_items_migration) — mantê-los
# contaria a mesma massa duas vezes. Os itens que sobraram nesta seção são
# só os NÃO-estruturais (equipamentos/instalação).

[[masses.items]]
name = "mobiliario"
mass_kg = 45.0
arm_ref = "pax_front"
arm_offset_m = 0.5

[[masses.items]]
# Campanha E1–E6 (2026-08-05), mudança 3: ganha arm_offset_m = 1.3 —
# roteamento de cabos/mangueiras até a bateria traseira recolocada
# (mudança 2), deslocando o braço efetivo deste item para trás a partir
# de fuselage_struct_m (4.20 → 5.50 m). Antigo: sem offset (0, implícito).
name = "cabos_hidraulico"
mass_kg = 20.0
arm_ref = "fuselage_struct"
arm_offset_m = 1.3

[[masses.items]]
name = "portas_vidros"
mass_kg = 28.0
arm_ref = "pax_front"

[[masses.items]]
name = "antepara_firewall"
mass_kg = 12.0
arm_ref = "engine_cg"
arm_offset_m = 0.9

# Orçamento elétrico (Task 5.2) — barramento, alternador e cargas
# individuais. Alimenta `agents::electrical::ElectricalAgent` (soma pura,
# sem laço de convergência de MTOW).
[electrical]
bus_voltage_v = 28.0
# Alternador automotivo típico ~32A @ 28V ≈ 900W (derateado da placa por
# margem de projeto/temperatura), acoplado ao motor a pistão via
# correia/PSRU.
alternator_w = 900.0

[[electrical.loads]]
name = "avionicos"
continuous_w = 180.0
peak_w = 220.0

[[electrical.loads]]
name = "luzes_nav_strobe"
continuous_w = 45.0
peak_w = 90.0

[[electrical.loads]]
name = "bomba_combustivel"
continuous_w = 60.0
peak_w = 120.0

[[electrical.loads]]
name = "trem_retratil"
continuous_w = 0.0
# Pico só durante a retração/extensão — não é contínuo. 520W é o pico
# ELÉTRICO estimado de um atuador linear real (perdas de eficiência do
# motor/mecanismo + corrente de partida) — NÃO o mesmo número que a
# potência MECÂNICA idealizada calculada por
# `agents::landing_gear::actuator_power_w` (≈18,5W no baseline: massa de
# perna 27,5kg, Δh 0,40m, 7,0s de retração — ver
# `LandingGearAgent::run`). A guarda de consistência em
# `models::config::validate_aircraft` só exige peak_w >= a potência
# MECÂNICA (piso físico, não o pico elétrico real esperado) — 520W dá
# folga generosa em relação a esse piso E é consistente com atuadores
# lineares elétricos reais de trem de pouso leve (ordem de algumas
# centenas de watts de pico).
peak_w = 520.0

[[electrical.loads]]
name = "flaps"
continuous_w = 0.0
peak_w = 150.0

[[electrical.loads]]
name = "pitot_aquecido"
continuous_w = 90.0
peak_w = 90.0

[[electrical.loads]]
name = "radio_transponder"
continuous_w = 55.0
peak_w = 70.0

# Modelo de massas estruturais (ciclo 3) — equações de componente Raymer
# cap. 15.2 (GA) × fatores de composto (Tab. 15.4). As 7 massas estruturais
# do OEW são COMPUTADAS por agents::mass_model — os antigos itens fixos de
# [[masses.items]] (asa, fuselagem, trem_principal, trem_nariz, tanques) e
# [empennage].mass_per_area_* foram removidos (erro de migração se presentes).
[mass_model]
composite_factor_wing        = 0.85  # Raymer Tab. 15.4 (asa composta)
composite_factor_tail        = 0.83  # idem (empenagens)
composite_factor_fuselage    = 0.90  # idem (fuselagem)
composite_factor_gear        = 0.95  # idem (trem)
composite_factor_fuel_system = 1.00  # tanques integrais compostos ≈ metálicos
d_fus_equiv_m                = 1.30  # cabine 1.22 m + estrutura
fuselage_wetted_coeff        = 0.75  # corpo afilado vs cilindro pleno
landing_load_factor_ult      = 4.5   # N_l = N_pouso×1.5 (Raymer 15.2)
# Campanha E10 (2026-08-08): 0.67 → 0.54 e 0.53 → 0.40 — COERÊNCIA
# DIMENSIONAL com [gear].h_cg_ground_m 1.05 → 0.92 (−13 cm): as pernas
# encurtam exatamente os mesmos 13 cm que o CG desceu. Estes comprimentos
# alimentam as equações de massa de trem de Raymer (15.2), então o trem curto
# também pesa um pouco menos — parte da variação de OEW de E10 vem daqui (o
# resto, para cima, vem dos +25 kg de bateria). Antigos: 0.67 / 0.53.
main_strut_length_m          = 0.54  # curso oleo + roda, trem curto E10
nose_strut_length_m          = 0.40  # idem
# Ciclo 4 (task robustez): ±σ da estatística de frota das equações de peso
# acima — Raymer cap. 15/Roskam Classe II citam ±10–20% em projeto
# conceitual (equações empíricas ajustadas a uma frota histórica, não a
# ESTA aeronave). Consumida por validation::robustness::adversarial_masses
# para construir os dois conjuntos adversariais de massas estruturais e
# quantificar se checks que PASSAM no nominal sobrevivem à incerteza do
# modelo — módulo ainda ISOLADO (sem check no pipeline, ver task-4).
sigma_mass_fraction           = 0.15
