# Missão baseline — requisitos do projeto originados das premissas do
# cliente. Antes da Task 2.2, estes valores eram constantes hardcoded em
# `Requirements::project_default()` (src/models/requirements.rs). Trocar de
# missão agora é trocar este arquivo, não o código.

passengers = 4
pax_mass_kg = 90.0
baggage_kg = 80.0
cruise_speed_min_kmh = 280.0
# Campanha E7 (2026-08-06): 8.0 → 7.0 — decisão de requisito do cliente:
# autonomia de 7h de voo + reserva (fuel_reserve_fraction abaixo
# inalterada). Fecha, junto com gear.x_main_m (ver [gear] em
# baseline_4seat.toml), a margem de combustível insuficiente do baseline
# E6 (ver histórico no bloco min_fuel_margin_fraction abaixo). Validado
# experimentalmente (campanha E7, 48 execuções do pipeline real).
# endurance_min_h antigo: 8.0.
endurance_min_h = 7.0
fuel_reserve_fraction = 0.10   # 10% + 45 min embutidos no endurance
cruise_altitude_m = 2500.0
airfield_altitude_m = 0.0
isa_delta_c = 0.0

# Margem mínima de combustível como requisito (Task 3, refino-ciclo2) —
# fração da CAPACIDADE do tanque (`[fuel_system].capacity_l`), não do
# combustível exigido pela missão (ver nota de convenção em
# `validation::constraint_checker::ConstraintChecker::verify`, checagem
# #18). Achado honesto do baseline E6 (Toyota + missão de 8h): margem
# ≈1,58% da capacidade (260 L de tanque, ~255,9 L exigidos) — ABAIXO deste
# piso de 5%. VIOLAÇÃO REPORTADA honestamente (o requisito funcionando) —
# não mascarada aumentando o tanque ou reduzindo a missão; a decisão de
# projeto (tanque maior, missão menor, ou aceitar o risco) ficou para
# revisão humana.
#
# RESOLVIDO na campanha E7 (2026-08-06): decisão do cliente reduziu a
# missão para endurance_min_h=7.0 (ver acima). Combustível exigido cai
# para ~223,7 L (260 L de tanque), margem sobe para ~13,97% — acima do
# piso de 5%. Gate permanece ativo (não relaxado): continua detectando a
# violação em configs sintéticas mutadas (ver
# tests/generic_engine.rs — cobertura da checagem #18 preservada).
min_fuel_margin_fraction = 0.05

# Pista disponível (m) — grama/terra (Ciclo 6, task 2). Premissa de operação
# do projeto: decisão do cliente (2026-08-08), 600 m, deliberadamente
# apertada — pista de fazenda típica, não um aeródromo pavimentado. Gates:
# check #23 (decolagem na grama sobre 15 m) e #24 (pouso sobre 15 m) de
# `validation::constraint_checker::ConstraintChecker::verify`.
runway_available_m = 600.0

# Análise de missão por segmentos (Task 5.1) — táxi, subida integrada,
# cruzeiro Breguet e descida substituem o antigo modelo de consumo
# constante. Ver `agents::mission::MissionAgent` e
# `models::requirements::AnalysisCfg`.
[analysis]
taxi_fuel_l = 3.0              # táxi + run-up fixo (L)
descent_rate_ms = 4.0          # taxa de descida de projeto (m/s)
descent_power_fraction = 0.20  # 20% da vazão de combustível de cruzeiro
climb_speed_policy = "vy"      # única política suportada hoje
