# Missão "ferry" — caso de aceitação de genericidade motor-agnóstica (Task
# 6.2). O motor Rotax 915 iS não sustenta a missão de projeto completa
# (280 km/h / 8 h — ver tests/cli.rs,
# `engine_flag_troca_motor_e_rotax_falha_honestamente_por_combustivel`: exige
# ~401,8 L contra os 260 L do tanque, campanha E1–E6 2026-08-05; era ~393,3 L
# antes). Essa é a resposta honesta do modelo para aquela missão, não um bug.
#
# Este arquivo existe para provar o espírito da genericidade — trocar dados
# (motor + missão), não código, e obter uma segunda especificação completa e
# fisicamente coerente — reduzindo passageiros/velocidade/autonomia para uma
# missão de traslado ("ferry") que o Rotax sustenta com folga (verificado por
# execução real antes de fixar este arquivo: 74,4 L requeridos contra 260 L
# de capacidade, ~71,4% de margem — task 4, refino-ciclo2 (arrasto de trim
# em cruzeiro): era 72,7 L / ~72,0% (campanha E1-E6); o CG de meia-missão
# desta célula com o Rotax fica bem mais atrás (motor mais leve no nariz),
# exigindo mais CL_h_trim/ΔCD_trim que no caso Toyota — ver
# tests/acceptance.rs).
passengers = 2
pax_mass_kg = 90.0
baggage_kg = 20.0
cruise_speed_min_kmh = 200.0
endurance_min_h = 3.0
fuel_reserve_fraction = 0.10
cruise_altitude_m = 2000.0
airfield_altitude_m = 0.0
isa_delta_c = 0.0

# Margem mínima de combustível como requisito (Task 3, refino-ciclo2) —
# mesmo piso de `config/missions/default.toml` (5%, fração da CAPACIDADE
# do tanque). Verificado por execução real antes de fixar este arquivo:
# Rotax 915 iS + esta missão exige ~74,4 L contra 260 L de capacidade —
# margem ≈71,4% da capacidade, MUITO acima do piso (a missão ferry foi
# escolhida deliberadamente com folga, não é um caso-limite) — ver
# `tests/acceptance.rs::rotax_missao_ferry_gera_spec_completo_data_driven`.
min_fuel_margin_fraction = 0.05

[analysis]
taxi_fuel_l = 3.0
descent_rate_ms = 4.0
descent_power_fraction = 0.20
climb_speed_policy = "vy"
