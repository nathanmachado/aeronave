[[masses.items]]
name = "portas_vidros"
mass_kg = 28.0
arm_ref = "pax_front"

[[masses.items]]
name = "antepara_firewall"
mass_kg = 12.0
arm_ref = "engine_cg"
arm_offset_m = 0.9
